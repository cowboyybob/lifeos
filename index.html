<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0C0F">
<meta name="description" content="Life OS: планировщик дня вокруг важного. Свои направления жизни, привычки, итоги дня и цели.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Bento. Everything lives in rounded tiles on a grid: 2 columns on a phone, 4 on a desktop with the schedule as a tall tile on the right.
   Colours come from the chosen palette (8 in Settings, Berry by default); "glass" adds soft colour blobs behind translucent frosted tiles. */
:root{
  --bg:#FBF0F2; --ink:#3A0E22; --sub:#8A5A6C; --surf:#FFFFFF; --line:rgba(58,14,34,.10);
  --hero:#4A1030; --heroInk:#FFF3F6; --t1:#FFC3D2; --t1i:#3A0E22; --t2:#FFE7B3; --t2i:#3A0E22;
  --accent:#E0336E; --accentInk:#FFFFFF; --warn:#C8252F; --warnSoft:#FFE0E2; --ok:#2F8F55;
  --blob1:#FF8FB1; --blob2:#FFD27A; --blob3:#B79CFF;
  --c0:#E0336E; --c1:#F2A33A; --c2:#7A5CC9; --c3:#2FA37A; --c4:#2E84D6; --c5:#D9572B; --c6:#B8408F; --c7:#8A7F86;
  --r:26px; --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tileBg:var(--surf); --blur:none; --tileBorder:transparent;
}
:root.glass{--tileBg:color-mix(in srgb,var(--surf) 58%,transparent);--blur:blur(22px) saturate(1.5);--tileBorder:color-mix(in srgb,#fff 45%,transparent)}
:root.glass.dark{--tileBg:color-mix(in srgb,var(--surf) 55%,transparent);--tileBorder:rgba(255,255,255,.10)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;transition:background .3s}
:root.glass body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 32% at 12% 10%,var(--blob1),transparent 70%),radial-gradient(34% 30% at 92% 22%,var(--blob2),transparent 70%),radial-gradient(42% 36% at 70% 92%,var(--blob3),transparent 70%),radial-gradient(30% 28% at 8% 80%,var(--blob2),transparent 70%);
  filter:blur(40px);opacity:.75}
.app{max-width:1240px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.05}
h2{font-size:1.05rem;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--sub)}
.small{font-size:.82rem}
.label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;opacity:.65}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card,.tile{background:var(--tileBg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--tileBorder);border-radius:var(--r);padding:16px;min-width:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:14px;padding:10px 16px;font-weight:700;transition:transform .12s,filter .15s}
button:active{transform:scale(.96)}
button:hover{filter:brightness(.97)}
button.primary,button.hot{background:var(--hero);color:var(--heroInk)}
button.soft{background:color-mix(in srgb,var(--ink) 6%,transparent)}
button.ghost{background:transparent;padding:6px 8px;color:var(--accent)}
button.block{width:100%;padding:15px;font-size:1rem;border-radius:18px}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
input,select,textarea{background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid transparent;border-radius:14px;padding:11px 13px;min-width:0;width:100%;font-weight:600}
input::placeholder,textarea::placeholder{color:var(--sub);font-weight:500}
textarea{resize:vertical;min-height:56px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:9px;border:2px solid color-mix(in srgb,var(--ink) 35%,transparent);flex:none;margin:0;padding:0;display:grid;place-items:center;cursor:pointer;background:transparent}
input[type=checkbox]:checked{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
input[type=checkbox]:checked::after{content:"";width:10px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent);white-space:nowrap}
.pill.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill.warn{color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
a{color:inherit}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;font-size:1.05rem}
.brand i{width:34px;height:34px;border-radius:12px;background:var(--hero);color:var(--heroInk);display:grid;place-items:center;font-style:normal;font-size:.85rem}
.toptabs{display:none;gap:4px;padding:5px;border-radius:18px;background:var(--tileBg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--tileBorder)}
.toptabs button{background:transparent;padding:8px 16px;border-radius:13px}
.toptabs button[aria-current=page]{background:var(--hero);color:var(--heroInk)}
.topact{display:flex;gap:8px;align-items:center}
.topact .addtop{display:none}
.icon-round{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:14px;background:var(--tileBg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--tileBorder)}
.icon-round svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* page header */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 4px 14px}
.phead .label{margin-bottom:6px;display:block}
.narrow{max-width:760px}

/* bento today */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-template-areas:"hello hello" "hero hero" "ring streak" "focus focus" "week week" "tip tip" "pri pri" "sched sched"}
.a-focus{grid-area:focus}
.a-hello{grid-area:hello;padding:4px 4px 2px}
.a-hello h1 span{color:var(--accent)}
.a-hero{grid-area:hero;background:var(--hero);color:var(--heroInk);border:none;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.a-hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 70%,transparent),transparent 70%);opacity:.55}
.a-hero .clock{font-weight:800;font-size:clamp(3.4rem,13vw,5.2rem);letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
.a-hero .next{font-weight:600;opacity:.9;max-width:34ch}
.a-hero .next b{font-weight:800}
.a-hero .bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--heroInk) 18%,transparent);overflow:hidden}
.a-hero .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.a-hero .row .pill{background:color-mix(in srgb,var(--heroInk) 16%,transparent)}
.a-ring{grid-area:ring;background:var(--t1);color:var(--t1i);border:none}
.a-streak{grid-area:streak;background:var(--t2);color:var(--t2i);border:none}
:root.glass .a-ring{background:color-mix(in srgb,var(--t1) 72%,transparent)}
:root.glass .a-streak{background:color-mix(in srgb,var(--t2) 72%,transparent)}
.ring{width:78px;height:78px;margin-top:6px}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:currentColor;opacity:.15}
.ring .fgc{stroke:currentColor;stroke-linecap:round}
.ring text{font-weight:800;font-size:13px;fill:currentColor}
.big{font-weight:800;font-size:1.9rem;letter-spacing:-.05em;line-height:1.05;margin-top:6px}
.dots7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dots7 i{aspect-ratio:1;border-radius:7px;background:currentColor;opacity:.15}
.dots7 i.on{opacity:1}
.a-week{grid-area:week;padding:8px}
.a-tip{grid-area:tip}
.a-pri{grid-area:pri}
.a-sched{grid-area:sched}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;border-radius:16px;background:transparent}
.week button small{font-size:.62rem;font-weight:800;text-transform:uppercase;opacity:.55}
.week button span{font-weight:800;font-size:1.1rem;letter-spacing:-.03em}
.week button i{width:5px;height:5px;border-radius:50%}
.week button i.has{background:var(--accent)}
.week button[aria-current=date]{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.week button.sel{background:var(--hero);color:var(--heroInk)}
.week button.sel i.has{background:var(--heroInk)}
.tip h3{font-size:1.05rem;margin-top:6px}
.tip p{margin:4px 0 0;color:var(--sub);font-weight:500}
.pri{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;border-top:1px solid var(--line)}
.pri:first-of-type{border-top:none}
.pri .n{width:24px;height:24px;border-radius:8px;background:var(--t1);color:var(--t1i);display:grid;place-items:center;font-weight:800;font-size:.75rem}
.pri input{background:transparent;padding:12px 2px;border-radius:0}
.sched-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:8px}
@media (max-width:640px){.sched-head h2{flex-basis:100%}.sched-tools{width:100%}.sched-tools .seg{margin-left:auto}}

/* timeline */
.rail{display:flex;flex-direction:column;gap:4px}
.hwrap{overflow-x:auto;margin:0 -4px;padding:0 4px 8px;scroll-behavior:smooth}
.htrack{position:relative}
.htrack .hh{position:absolute;top:0;bottom:0;border-left:1px dashed color-mix(in srgb,var(--ink) 12%,transparent)}
.htrack .hh span{position:absolute;top:0;left:4px;font-family:var(--mono);font-size:.68rem;color:var(--sub)}
.htrack .hm{position:absolute;top:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:800;white-space:nowrap;color:var(--sub)}
.htrack .hm i{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.45}
.htrack .hm.pr i{background:var(--accent);opacity:1}
.htrack .hb{position:absolute;height:58px;border-radius:14px;padding:6px 8px;background:color-mix(in srgb,var(--c) 16%,var(--surf));border-left:4px solid var(--c);overflow:hidden;text-align:left;color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:.74rem;line-height:1.15}
.htrack .hb b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htrack .hb small{font-family:var(--mono);font-size:.64rem;color:var(--sub)}
.htrack .hb.done b{text-decoration:line-through;opacity:.55}
.htrack .hb.cls{--c:var(--hero)}
.htrack .hb.clash{outline:1.5px solid var(--warn);background:var(--warnSoft)}
.htrack .hnow{position:absolute;top:18px;bottom:0;width:2px;background:var(--accent);border-radius:2px}
.htrack .hnow::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ti{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}
.ti .tm{font-family:var(--mono);font-size:.74rem;color:var(--sub);text-align:right}
.ti .tm small{display:block;font-size:.64rem;opacity:.75}
.blk{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:18px;background:color-mix(in srgb,var(--c) 13%,transparent);min-width:0;position:relative}
.blk::before{content:"";width:5px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.blk .t{flex:1;min-width:0}
.blk .t b{font-weight:800;display:block;overflow-wrap:anywhere;letter-spacing:-.01em}
.blk .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.74rem;color:var(--sub);font-weight:600}
.blk .tag{display:inline-flex;align-items:center;gap:5px}
.blk.done .t b{text-decoration:line-through;opacity:.55}
.ti.clash .blk{background:var(--warnSoft);outline:1.5px solid var(--warn)}
.blk .warnline{font-size:.78rem;color:var(--warn);font-weight:700;margin-top:3px}
.ti.anchor .blk{background:transparent;border:1.5px dashed color-mix(in srgb,var(--ink) 18%,transparent);padding-block:8px}
.ti.anchor .blk::before{background:var(--ink);opacity:.35}
.anc{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.anc .nm{font-weight:800}
.anc .sub{font-size:.72rem;color:var(--sub);font-weight:600}
.anc input{margin-left:auto}
.icon-btn{background:transparent;color:var(--sub);padding:4px 8px;font-size:1rem;line-height:1;border-radius:10px}
.gap{display:grid;grid-template-columns:48px 1fr;gap:10px}
.a-focus{background:var(--t2);color:var(--t2i)}
.a-focus .fnum{font-family:var(--mono);font-size:2.1rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.a-focus .chips button{background:color-mix(in srgb,var(--t2i) 10%,transparent);color:inherit}
.sched-tools{display:flex;gap:6px;flex-wrap:wrap}
.sched-tools button{padding:6px 10px;font-size:.76rem}
#focus{position:fixed;inset:0;z-index:30;background:var(--hero);color:var(--heroInk);display:none;place-items:center;padding:24px}
#focus.on{display:grid}
#focus .fin{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
#focus .fring{width:min(78vw,300px);aspect-ratio:1}
#focus .fring circle{fill:none;stroke-width:6}
#focus .fring .bgc{stroke:color-mix(in srgb,var(--heroInk) 16%,transparent)}
#focus .fring .fgc{stroke:var(--t1);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
#focus .ftime{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.04em;fill:currentColor}
#focus .row button{background:color-mix(in srgb,var(--heroInk) 14%,transparent);color:var(--heroInk)}
#focus .row button.go{background:var(--t1);color:var(--t1i)}
.ydots{display:grid;grid-template-columns:repeat(auto-fill,minmax(9px,1fr));gap:3px}
.ydots i{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.ydots i.p{background:color-mix(in srgb,var(--accent) calc(var(--v)*100%),color-mix(in srgb,var(--ink) 14%,transparent))}
.ydots i.t{outline:2px solid var(--accent);outline-offset:1px}
.ydots i.f{opacity:.45}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid .mc{aspect-ratio:1;border-radius:18px;background:var(--tileBg);border:1px solid var(--tileBorder);position:relative;display:flex}
.mgrid .mc textarea{border:0;background:transparent;resize:none;text-align:center;font-weight:700;font-size:.86rem;padding:10px 8px;height:100%;width:100%;border-radius:18px;line-height:1.25}
.mgrid .mc.ctr{background:var(--hero);color:var(--heroInk)}
.mgrid .mc.ctr textarea{color:var(--heroInk);font-size:1rem}
.mgrid .mc.th{background:var(--t1);color:var(--t1i)}
.mgrid .mc.th textarea{color:var(--t1i)}
.mgrid .mc .zoom{position:absolute;right:6px;bottom:6px;padding:2px 7px;font-size:.7rem;border-radius:9px;background:color-mix(in srgb,currentColor 14%,transparent);color:inherit}
.mbig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-width:640px}
.mbig .blk3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border-radius:14px;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.mbig .blk3 button{aspect-ratio:1;font-size:.62rem;font-weight:700;padding:3px;border-radius:9px;background:var(--tileBg);color:var(--ink);overflow:hidden;line-height:1.15;overflow-wrap:anywhere}
.mbig .blk3 button.th{background:var(--t1);color:var(--t1i)}
.mbig .blk3 button.ctr{background:var(--hero);color:var(--heroInk)}
.prop{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.prop .times{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.ti.cls .blk{background:color-mix(in srgb,var(--hero) 12%,transparent)}
.ti.cls .blk::before{background:var(--hero)}
.ttwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tt{width:100%;border-collapse:separate;border-spacing:4px;min-width:560px;table-layout:fixed}
.tt th{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);text-align:left;padding:2px 4px}
.tt th.slot{width:62px;font-family:var(--mono);text-transform:none;letter-spacing:0;font-weight:600}
.tt td{padding:0}
.tt td button{width:100%;min-height:46px;text-align:left;padding:6px 8px;border-radius:12px;font-size:.74rem;font-weight:700;line-height:1.2;background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink);overflow-wrap:anywhere}
.tt td button.has{background:color-mix(in srgb,var(--hero) 14%,transparent)}
.tt td button.sel{outline:2px solid var(--accent)}
.ttrow{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center}
.ttrow b{font-family:var(--mono);font-size:.8rem;color:var(--sub);text-align:center}
.slotrow{display:grid;grid-template-columns:30px 1fr 1fr auto;gap:8px;align-items:center}
.slotrow b{font-family:var(--mono);font-size:.8rem;color:var(--sub);text-align:center}
.wkbadge{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--hero);color:var(--heroInk);font-size:.72rem;font-weight:800}
.gap button{justify-self:start;background:transparent;color:var(--sub);font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:10px}
.gap button::before{content:"+ ";color:var(--accent)}
.gap button:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.now{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}
.now span{font-family:var(--mono);font-size:.7rem;color:var(--accent);text-align:right;font-weight:700}
.now i{height:2px;background:var(--accent);border-radius:2px;position:relative}
.now i::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* habits */
.hab{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.hab:last-child{border-bottom:none}
.hab b{font-weight:800}
.cells{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:8px;max-width:420px}
.cells i{aspect-ratio:1;width:100%;border-radius:5px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.cells i.on{background:var(--c,var(--accent))}
.cells i.today{outline:2px solid var(--ink);outline-offset:1px}
.streak{text-align:right}
.streak b{display:block;font-size:1.8rem;letter-spacing:-.05em;line-height:1}
.streak small{font-size:.64rem;color:var(--sub);font-weight:700;text-transform:uppercase}
.hint{font-size:.8rem;color:var(--warn);font-weight:700;margin-top:3px}

/* review */

}

<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Разделы"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
const KEY="lifeos.public.v1";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const toMin=s=>{if(!s)return 0;const[a,b]=s.split(":").map(Number);return a*60+b};
const fromMin=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
const dur=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+" ч ":"")+(r?r+" мин":"")};
const WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

/* ---------- prayer times (optional module) ---------- */
function prayerTimes(date,lat,lng,tz,o){
  const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R);
  const asin=x=>Math.asin(x)/R,acos=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R,acot=x=>Math.atan(1/x)/R,atan2=(y,x)=>Math.atan2(y,x)/R;
  const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
  let Y=date.getFullYear(),M=date.getMonth()+1;const d=date.getDate();if(M<=2){Y--;M+=12}
  const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const jd0=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5-lng/360;
  const sun=jd=>{const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-.00000036*D,RA=atan2(cos(e)*sin(L),cos(L))/15;return{decl:asin(sin(e)*sin(L)),eqt:q/15-fix(RA,24)}};
  const noon=t=>fix(12-sun(jd0+t/24).eqt,24);
  const angT=(a,t,ccw)=>{const s=sun(jd0+t/24),v=acos((-sin(a)-sin(s.decl)*sin(lat))/(cos(s.decl)*cos(lat)))/15;return noon(t)+(ccw?-v:v)};
  const asrT=(f,t)=>{const s=sun(jd0+t/24);return angT(-acot(f+tan(Math.abs(lat-s.decl))),t)};
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
  for(let i=0;i<2;i++){t={fajr:angT(o.fajr,t.fajr,true),sunrise:angT(.833,t.sunrise,true),dhuhr:noon(t.dhuhr),asr:asrT(o.asr,t.asr),maghrib:angT(.833,t.maghrib),isha:angT(o.isha,t.isha)}}
  const r={};for(const k in t)r[k]=Math.round((t[k]+tz-lng/15)*60+((o.adj||{})[k]||0));return r;
}
const PRAYERS=[["fajr","Фаджр"],["sunrise","Восход"],["dhuhr","Зухр"],["asr","Аср"],["maghrib","Магриб"],["isha","Иша"]];
const CITIES={
  "Бишкек":{lat:42.8746,lng:74.5698,tz:6},"Ош":{lat:40.5283,lng:72.7985,tz:6},"Алматы":{lat:43.2389,lng:76.8897,tz:5},
  "Астана":{lat:51.1694,lng:71.4491,tz:5},"Ташкент":{lat:41.2995,lng:69.2401,tz:5},"Душанбе":{lat:38.5598,lng:68.787,tz:5},
  "Баку":{lat:40.4093,lng:49.8671,tz:4},"Москва":{lat:55.7558,lng:37.6173,tz:3},"Казань":{lat:55.7963,lng:49.1088,tz:3},
  "Стамбул":{lat:41.0082,lng:28.9784,tz:3},"Берлин":{lat:52.52,lng:13.405,tz:1},"Лондон":{lat:51.5072,lng:-.1276,tz:0}
};
const BISHKEK_ADJ={fajr:-1,sunrise:-1,dhuhr:0,asr:2,maghrib:7,isha:0};
function prayerCfg(city,on){return {on:!!on,city,...CITIES[city],buffer:10,method:{fajr:18,isha:city==="Бишкек"?16:17,asr:2,adj:city==="Бишкек"?{...BISHKEK_ADJ}:{}}}}

/* ---------- presets ---------- */
const PRESETS=[
  ["Учёба","Повторение 15 мин"],["Работа","План на завтра"],["Карьера","30 мин на навык"],["Здоровье","Сон 8 часов"],
  ["Спорт","Зарядка 10 мин"],["Питание","Вода 2 литра"],["Семья","Позвонить родным"],["Друзья","Написать другу"],
  ["Финансы","Записать расходы"],["Творчество","15 мин практики"],["Духовность","Чтение 10 мин"],["Языки","10 новых слов"],
  ["Проекты","1 задача по проекту"],["Отдых","Прогулка 20 мин"],["Дом","Уборка 10 мин"],["Чтение","20 страниц"]
];
const ANCHOR_IDEAS=[["Обед","13:00"],["Начало учёбы","09:00"],["Начало работы","09:00"],["Ужин","19:00"],["Тренировка","18:00"]];

/* ---------- example ---------- */
function example(){
  const t=new Date();
  const dirs=[["Учёба",0],["Спорт",1],["Здоровье",2],["Проекты",3],["Семья",6]].map(([n,c])=>({id:uid(),name:n,c}));
  const [U,Sp,Z,P,F]=dirs.map(d=>d.id);
  const habits=[{id:uid(),name:"Повторение 15 мин",dir:U},{id:uid(),name:"Зарядка 10 мин",dir:Sp},{id:uid(),name:"Сон 8 часов",dir:Z},{id:uid(),name:"Позвонить родным",dir:F}];
  const days={};const pat=["1101","1111","1010","1111","1110","0110","1111","1011","1111","0100","1101","1111","1110"];
  for(let i=13;i>=1;i--){const k=dkey(addDays(t,-i)),p=pat[13-i],h={};habits.forEach((x,j)=>{if(p[j]==="1")h[x.id]=true});
    days[k]={blocks:[{id:uid(),s:"09:00",e:"10:00",t:"Учёба",dir:U,done:true}],priorities:[],habits:h,prayed:{},review:{energy:{m:5+(i%3),d:4+(i%2),e:6},sleep:7+(i%3)*.5,dirs:{},kaizen:""}}}
  days[dkey(t)]={priorities:["Сдать лабораторную","Тренировка","Лечь до 23:00"],habits:{[habits[0].id]:true},prayed:{},review:null,blocks:[
    {id:uid(),s:"07:30",e:"08:00",t:"Зарядка и душ",dir:Sp},{id:uid(),s:"09:00",e:"12:30",t:"Пары",dir:U},
    {id:uid(),s:"14:00",e:"15:30",t:"Лабораторная по физике",dir:U},{id:uid(),s:"15:15",e:"16:00",t:"Созвон по проекту",dir:P},
    {id:uid(),s:"18:00",e:"19:00",t:"Тренировка",dir:Sp},{id:uid(),s:"20:30",e:"21:00",t:"Звонок родителям",dir:F}]};
  const goals={};dirs.forEach(d=>goals[d.id]={y1:"",y5:"",y10:""});
  goals[U]={y1:"Закрыть сессию без троек",y5:"Магистратура за границей",y10:""};goals[Sp]={y1:"Подтягиваться 15 раз",y5:"",y10:""};
  return {example:true,v:2,profile:{name:"",wake:"07:00",sleep:"23:00",anchors:[{id:uid(),name:"Обед",time:"13:00"}],prayer:prayerCfg("Бишкек",false)},dirs,habits,days,goals};
}

/* ---------- storage + account sync (Supabase) ---------- */
function loadLocal(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
let S=loadLocal()||example();
let DB=null,UID=null,EMAIL="",sync="local",lastSent={},flushT=null,writing=false,dirtyRender=false;
const CFG=window.LIFEOS_CONFIG||{};
const SB=(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(UID&&!S.example){clearTimeout(flushT);flushT=setTimeout(flush,700)}}
function docsOf(st){const o={state:{v:2,profile:st.profile,dirs:st.dirs,habits:st.habits,goals:st.goals,ui:st.ui||{},mandala:st.mandala||null,templates:st.templates||[]}};for(const k in st.days)o["day-"+k]={date:k,...st.days[k]};return o}
async function flush(){
  if(writing){flushT=setTimeout(flush,700);return}writing=true;
  try{const docs=docsOf(S),rows=[];for(const id in docs){const j=JSON.stringify(docs[id]);if(lastSent[id]!==j)rows.push({user_id:UID,id,body:docs[id],updated_at:new Date().toISOString()})}
    if(rows.length){const {error}=await SB.from("lifeos_docs").upsert(rows);if(error)throw error;rows.forEach(r=>lastSent[r.id]=JSON.stringify(r.body))}
    setSync("cloud")}
  catch(e){setSync("error");if(!flush.warned){flush.warned=1;toast("Не получается сохранить. Если не пройдёт, напиши в Telegram @sn14kn")}}finally{writing=false}
}
function syncPill(){const t={cloud:["В аккаунте","ok"],loading:["Загружаю…",""],error:["Нет связи, сохраню позже","warn"],local:["В этом браузере",""]}[sync];return `<span class="pill ${t[1]} syncpill">${t[0]}</span>`}
function setSync(m){sync=m;document.querySelectorAll(".syncpill").forEach(el=>el.outerHTML=syncPill())}
async function pull(){
  if(!SB||!UID)return;setSync("loading");
  const {data,error}=await SB.from("lifeos_docs").select("id,body").eq("user_id",UID);
  if(error){setSync("error");return}
  if(!data.length){setSync("cloud");if(!S.example)save();return}
  const st={v:2,days:{}};data.forEach(r=>{lastSent[r.id]=JSON.stringify(r.body);const b=JSON.parse(JSON.stringify(r.body));
    if(r.id==="state")Object.assign(st,b);else if(r.id.startsWith("day-")){delete b.date;st.days[r.id.slice(4)]=b}});
  setSync("cloud");if(!st.profile)return;st.example=false;
  if(!S.example&&JSON.stringify(docsOf(st))===JSON.stringify(docsOf(S)))return;
  S=st;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(layer.querySelector(".full"))layer.innerHTML="";
  const a=document.activeElement;if(a&&a.closest&&a.closest("#app")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))dirtyRender=true;else render();
}
async function connect(){
  if(!SB)return;
  const apply=async session=>{const u=session&&session.user;const was=UID;UID=u?u.id:null;EMAIL=u?u.email:"";DB=UID?SB:null;
    if(!UID){setSync("local");if(tab==="settings")render();return}
    if(was!==UID){lastSent={};await pull();if(tab==="settings")render()}};
  const {data}=await SB.auth.getSession();await apply(data.session);
  SB.auth.onAuthStateChange((_e,session)=>apply(session));
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&UID&&!writing)pull()});
}
async function signIn(email){
  const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  return error;
}
async function signOut(){await SB.auth.signOut();UID=null;DB=null;lastSent={};setSync("local");render();toast("Вышел из аккаунта. План остался в этом браузере")}
document.addEventListener("focusout",()=>{if(dirtyRender)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){dirtyRender=false;render()}},0)});

/* ---------- helpers ---------- */
let tab="today",cur=new Date();
const app=document.getElementById("app"),layer=document.getElementById("layer");
const day=k=>{k=k||dkey(cur);if(!S.days[k])S.days[k]={blocks:[],priorities:[],habits:{},prayed:{},review:null};const d=S.days[k];d.blocks=d.blocks||[];d.priorities=d.priorities||[];d.habits=d.habits||{};d.prayed=d.prayed||{};return d};
const dirOf=id=>S.dirs.find(d=>d.id===id)||{name:"Без направления",c:7};
const cv=c=>`var(--c${c??7})`;
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function greet(){const h=new Date().getHours();return h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер"}
function welcome(){return S.example?`<section class="welcome"><h2>Это пример чужого дня</h2><p>Настрой Life OS под себя: свои направления жизни, цели и опорные точки дня. Это займёт минуту.</p><div class="row"><button data-act="onboard">Настроить под себя</button>${SB?`<button class="ghost" data-act="opensettings">Уже есть аккаунт? Войти</button>`:""}</div></section>`:""}
function anchorsFor(d){
  const p=S.profile,out=[];
  if(p.wake)out.push({id:"wake",name:"Подъём",m:toMin(p.wake),kind:"fixed"});
  (p.anchors||[]).forEach(a=>out.push({id:a.id,name:a.name,m:toMin(a.time),kind:"fixed"}));
  if(p.sleep)out.push({id:"sleep",name:"Отбой",m:toMin(p.sleep),kind:"fixed"});
  if(p.prayer&&p.prayer.on){const pt=prayerTimes(d,p.prayer.lat,p.prayer.lng,p.prayer.tz,p.prayer.method);PRAYERS.forEach(([id,n])=>out.push({id,name:n,m:pt[id],kind:id==="sunrise"?"info":"prayer"}))}
  return out;
}
/* ---------- class timetable (числитель / знаменатель) ---------- */
const DOW=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],DOWF=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const DEF_SLOTS=[["08:00","09:20"],["09:30","10:50"],["11:00","12:20"],["12:30","13:50"],["14:00","15:20"],["15:30","16:50"],["17:00","18:20"]];
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function ttOf(){const p=S.profile;if(!p.tt)p.tt={on:false,alt:true,ref:dkey(mondayOf(new Date())),slots:DEF_SLOTS.map(x=>({s:x[0],e:x[1]})),num:{},den:{}};const t=p.tt;t.num=t.num||{};t.den=t.den||{};t.slots=t.slots||[];return t}
function weekKind(d){const t=S.profile.tt;if(!t||!t.alt)return "num";const a=mondayOf(new Date(t.ref+"T00:00")),b=mondayOf(d);const w=Math.round((b-a)/6048e5);return ((w%2)+2)%2===0?"num":"den"}
const WKN={num:"числитель",den:"знаменатель"};
function classesFor(d){const t=S.profile.tt;if(!t||!t.on)return[];const dw=(d.getDay()+6)%7,wk=weekKind(d),row=((t[wk]||{})[dw])||{};
  return Object.keys(row).filter(i=>row[i]&&String(row[i]).trim()&&t.slots[i]).map(i=>({id:"c"+i,name:String(row[i]).trim(),m:toMin(t.slots[i].s),end:toMin(t.slots[i].e),n:+i+1,wk:t.alt?wk:null}))}
function parseTT(txt){
  const out={num:null,den:null,slots:[]};let mode="both",curDay=null;const DAYRX=/^(пн|вт|ср|чт|пт|сб|вс|пон|втор|сред|чет|пят|суб|вос)[а-яё]*\.?\s*[:\-–]?\s*/i;
  const dayIdx=w=>["пн","вт","ср","чт","пт","сб","вс"].indexOf(w.slice(0,2).toLowerCase().replace("по","пн").replace("ве","вт").replace("се","ср").replace("че","чт").replace("пя","пт").replace("су","сб").replace("во","вс"));
  const put=(wk,dw,i,name)=>{out[wk]=out[wk]||{};out[wk][dw]=out[wk][dw]||{};out[wk][dw][i]=name};
  let n=0;
  for(let raw of txt.split(/\r?\n/)){let l=raw.trim().replace(/\s+/g," ");if(!l)continue;
    if(/^пары\b|^время пар/i.test(l)){mode="slots";continue}
    if(/^числ/i.test(l)){mode="num";curDay=null;continue}
    if(/^знам/i.test(l)){mode="den";curDay=null;continue}
    if(/^(обе|кажд|все недели)/i.test(l)){mode="both";curDay=null;continue}
    let m=l.match(/^(\d{1,2})\s*[).:\-–]?\s*(\d{1,2}[:.]\d{2})\s*[-–—]\s*(\d{1,2}[:.]\d{2})\s*$/);
    if(m&&(mode==="slots"||!curDay)){const f=x=>{const[a,b]=x.replace(".",":").split(":");return pad(+a)+":"+b};out.slots[+m[1]-1]={s:f(m[2]),e:f(m[3])};continue}
    const dm=l.match(DAYRX);if(dm&&mode==="slots")mode="both";
    if(dm){const di=dayIdx(dm[1]);if(di>=0){curDay=di;l=l.slice(dm[0].length).trim();if(!l)continue}}
    m=l.match(/^(\d{1,2})\s*(?:пара)?\s*[).:\-–]?\s*(.+)$/i);
    if(m&&curDay!=null){const i=+m[1]-1,name=m[2].replace(/^[—–\-]\s*/,"").trim();if(!name||/^[—–\-]$/.test(name))continue;
      if(mode==="num"||mode==="both")put("num",curDay,i,name);if(mode==="den"||mode==="both")put("den",curDay,i,name);n++}
  }
  out.count=n;return out}
function dayProgress(k){const x=S.days[k];if(!x)return 0;const hb=S.habits.length,bl=(x.blocks||[]).length;const tot=hb+bl;if(!tot)return 0;return (S.habits.filter(h=>x.habits&&x.habits[h.id]).length+(x.blocks||[]).filter(b=>b.done).length)/tot}

function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}

function streak(h){let n=0,d=new Date();if(!(S.days[dkey(d)]&&S.days[dkey(d)].habits&&S.days[dkey(d)].habits[h.id]))d=addDays(d,-1);while(S.days[dkey(d)]&&S.days[dkey(d)].habits&&S.days[dkey(d)].habits[h.id]){n++;d=addDays(d,-1)}return n}
function renderHabits(){
  const t=new Date(),tk=dkey(t),yk=dkey(addDays(t,-1));
  const rows=S.habits.map(h=>{const dir=dirOf(h.dir),on=!!day(tk).habits[h.id];

/* ---------- HORIZONTAL TIMELINE ---------- */
function hTimeline(items,clash,isToday,nowM){
  const evs=items.filter(i=>i.type!=="anchor").map(i=>i.type==="block"?{s:i.m,e:Math.max(i.end,i.m+15),t:i.b.t,b:i.b,dir:dirOf(i.b.dir)}:{s:i.m,e:i.end,t:i.name,cls:true,n:i.n});
  const marks=items.filter(i=>i.type==="anchor");
  const all=[...evs.map(e=>e.s),...evs.map(e=>e.e),...marks.map(m=>m.m)];
  let a=Math.floor(Math.min(toMin(S.profile.wake||"07:00"),...all)/60)*60,b=Math.ceil(Math.max(toMin(S.profile.sleep||"23:00"),...all)/60)*60;if(b<=a)b=a+16*60;
  const PX=2.2,W=(b-a)*PX,x=m=>(m-a)*PX;
  const lanes=[];evs.sort((p,q)=>p.s-q.s).forEach(e=>{let l=lanes.findIndex(end=>end<=e.s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=e.e;e.l=l});
  const top=68,H=top+Math.max(1,lanes.length)*64+4;
  let h="";for(let m=a;m<=b;m+=60)h+=`<div class="hh" style="left:${x(m)}px"><span>${fromMin(m)}</span></div>`;
  marks.forEach(m=>{h+=`<div class="hm ${m.kind==="prayer"?"pr":""}" style="left:${x(m.m)}px" title="${esc(m.name)} ${fromMin(m.m)}"><i></i>${esc(m.name)}</div>`});
  evs.forEach(e=>{const st=`left:${x(e.s)}px;width:${Math.max(28,(e.e-e.s)*PX-4)}px;top:${top+e.l*64}px;${e.dir?`--c:${cv(e.dir.c)}`:""}`;
    h+=e.cls?`<button class="hb cls" style="${st}" data-act="opentt" title="${esc(e.t)}"><b>${esc(e.t)}</b><small>${fromMin(e.s)}–${fromMin(e.e)} · ${e.n} пара</small></button>`
      :`<button class="hb ${e.b.done?"done":""} ${clash(e.b)?"clash":""}" style="${st}" data-act="editblock" data-id="${e.b.id}" title="${esc(e.t)}"><b>${esc(e.t)}</b><small>${esc(e.b.s)}–${esc(e.b.e)}</small></button>`});
  if(isToday&&nowM>=a&&nowM<=b)h+=`<div class="hnow" style="left:${x(nowM)}px" aria-label="Сейчас"></div>`;
  return `<div class="hwrap" id="hwrap" data-now="${isToday?Math.max(0,x(nowM)-80):0}"><div class="htrack" style="width:${W+40}px;height:${H}px">${h}</div></div>`}

/* ---------- FOCUS TIMER ---------- */
const FKEY="lifeos.focus";let F=null,fTick=null;
try{F=JSON.parse(localStorage.getItem(FKEY)||"null")}catch(e){F=null}
const fSave=()=>{try{F?localStorage.setItem(FKEY,JSON.stringify(F)):localStorage.removeItem(FKEY)}catch(e){}};
const fLeft=()=>F?Math.max(0,F.paused?F.left:Math.round((F.end-Date.now())/1000)):0;
const mmss=sec=>pad(Math.floor(sec/60))+":"+pad(sec%60);
function focusTile(d){const mins=d.focus||0;
  if(F)return `<section class="tile a-focus"><div class="spread"><span class="label">фокус идёт</span><button class="ghost small" style="color:inherit" data-act="focusopen">Открыть →</button></div><div class="fnum" id="ftile">${mmss(fLeft())}</div><div class="small" style="font-weight:700;opacity:.75">${esc(F.title)}</div></section>`;
  return `<section class="tile a-focus"><div class="spread"><span class="label">фокус-таймер</span><span class="small" style="font-weight:700;opacity:.75">сегодня ${mins?dur(mins):"0 мин"}</span></div><div class="chips">${[25,50,90].map(m=>`<button class="chip" data-act="focusgo" data-m="${m}">▶ ${m} мин</button>`).join("")}</div></section>`}
function focusStart(min,title,blockId){F={dur:min*60,end:Date.now()+min*60*1000,title:title||"Фокус",blockId:blockId||null,date:dkey(new Date()),paused:false,left:0};fSave();focusShow();render()}
function focusShow(){let el=document.getElementById("focus");if(!el){el=document.createElement("div");el.id="focus";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Фокус-таймер");document.body.appendChild(el)}
  el.classList.add("on");focusDraw();clearInterval(fTick);fTick=setInterval(focusDraw,1000)}
function focusHide(){const el=document.getElementById("focus");if(el)el.classList.remove("on");clearInterval(fTick);fTick=null}
function focusDraw(){const el=document.getElementById("focus");if(!F){focusHide();return}
  const left=fLeft(),C=2*Math.PI*90,frac=F.dur?left/F.dur:0;
  if(left<=0&&!F.done){F.done=true;fSave();const d=day(F.date);d.focus=(d.focus||0)+Math.round(F.dur/60);save();notify("Фокус закончен","«"+F.title+"» — "+Math.round(F.dur/60)+" мин. Отдохни 5 минут.");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  const t=document.getElementById("ftile");if(t)t.textContent=mmss(left);
  if(!el||!el.classList.contains("on"))return;
  el.innerHTML=`<div class="fin"><div class="label" style="opacity:.75">${F.done?"готово":F.paused?"пауза":"фокус"}</div><h2 style="margin:0;font-size:1.4rem">${esc(F.title)}</h2>
    <svg class="fring" viewBox="0 0 200 200"><circle class="bgc" cx="100" cy="100" r="90"/><circle class="fgc" cx="100" cy="100" r="90" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 100 100)"/><text class="ftime" x="100" y="116" text-anchor="middle" font-size="44">${mmss(left)}</text></svg>
    ${F.done?`<p style="margin:0;opacity:.8">Засчитано ${Math.round(F.dur/60)} мин фокуса.</p><div class="row" style="justify-content:center">${F.blockId?`<button class="go" data-act="focusdoneblock">Блок сделан ✓</button>`:""}<button data-act="focusstop">Закрыть</button></div>`
      :`<div class="row" style="justify-content:center"><button class="go" data-act="focuspause">${F.paused?"Продолжить":"Пауза"}</button><button data-act="focusmin">Свернуть</button><button data-act="focusstop">Стоп</button></div><p class="small" style="margin:0;opacity:.7">Телефон экраном вниз. Одна задача.</p>`}</div>`}
function notify(title,body){try{if(S.ui&&S.ui.notif&&"Notification" in window&&Notification.permission==="granted"){navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification(title,{body,icon:"icons/icon-192.png"}):new Notification(title,{body})).catch(()=>new Notification(title,{body})):new Notification(title,{body})}}catch(e){}toast(title)}
/* reminders while the app is open */
const notified={};
setInterval(()=>{if(!S.ui||!S.ui.notif||S.example)return;const now=new Date(),k=dkey(now),nm=now.getHours()*60+now.getMinutes(),d=S.days[k];
  const ev=[];(d&&d.blocks||[]).forEach(b=>ev.push({id:"b"+b.id,m:toMin(b.s),t:b.t}));classesFor(now).forEach(c=>ev.push({id:c.id,m:c.m,t:c.name+" (пара)"}));anchorsFor(now).filter(a=>a.kind==="prayer").forEach(a=>ev.push({id:a.id,m:a.m,t:a.name}));
  ev.forEach(x=>{const key=k+x.id;if(!notified[key]&&x.m-nm<=5&&x.m-nm>=0){notified[key]=1;notify("Через "+(x.m-nm)+" мин: "+x.t,fromMin(x.m))}})},30000);

/* ---------- AUTO-PLAN ---------- */
function busyFor(dt){const d=day(dkey(dt)),buf=(S.profile.prayer&&S.profile.prayer.buffer)||0,out=[];
  d.blocks.forEach(b=>out.push([toMin(b.s),toMin(b.e)]));classesFor(dt).forEach(c=>out.push([c.m,c.end]));
  anchorsFor(dt).forEach(a=>{if(a.id==="wake"||a.id==="sleep"||a.kind==="info")return;out.push(a.kind==="prayer"?[a.m-buf-5,a.m+15]:[a.m,a.m+30])});
  return out.sort((a,b)=>a[0]-b[0])}
function freeGaps(dt){const isT=dkey(dt)===dkey(new Date()),nowM=new Date().getHours()*60+new Date().getMinutes();
  let st=toMin(S.profile.wake||"07:00")+30,en=toMin(S.profile.sleep||"23:00")-30;if(en<=st)en=st+14*60;if(isT)st=Math.max(st,Math.ceil((nowM+10)/5)*5);
  const gaps=[];let p=st;for(const [a,b] of busyFor(dt)){if(a>p)gaps.push([p,Math.min(a,en)]);p=Math.max(p,b);if(p>=en)break}if(p<en)gaps.push([p,en]);return gaps.filter(g=>g[1]-g[0]>=25)}
function autoPlan(){const dt=cur,d=day(dkey(dt)),have=new Set(d.blocks.map(b=>b.t.trim().toLowerCase()));
  const want=[];(d.priorities||[]).filter(x=>x&&x.trim()&&!have.has(x.trim().toLowerCase())).forEach(x=>want.push({t:x.trim(),m:50,dir:S.dirs[0]&&S.dirs[0].id}));
  S.dirs.filter(dir=>!d.blocks.some(b=>b.dir===dir.id)).slice(0,4).forEach(dir=>want.push({t:dir.name,m:30,dir:dir.id}));
  const gaps=freeGaps(dt).map(g=>[...g]),props=[];
  for(const w of want){const g=gaps.find(g=>g[1]-g[0]>=w.m);if(!g)continue;props.push({id:uid(),t:w.t,s:fromMin(g[0]),e:fromMin(g[0]+w.m),dir:w.dir,on:true});g[0]+=w.m+10}
  if(!props.length){sheet(`<div class="stack"><h2>Автоплан</h2><p class="muted" style="margin:0">${want.length?"Свободных окон под задачи не нашлось.":"Нечего предложить: впиши «Главное на день» или оставь направление без блока, и я найду для него окно."}</p><button class="ghost" data-act="close">Понятно</button></div>`);return}
  sheet(`<form class="stack" id="apform"><h2>Автоплан</h2><p class="small muted" style="margin:0">Нашёл свободные окна. Отметь, что добавить, и поправь время. Без твоего «да» ничего не встанет в день.</p>
    ${props.map(x=>{const dir=dirOf(x.dir);return `<div class="prop" style="--c:${cv(dir.c)}"><input type="checkbox" checked data-p="${x.id}" aria-label="Добавить ${esc(x.t)}"><input value="${esc(x.t)}" data-pt="${x.id}" aria-label="Название"><div class="times"><input type="time" value="${x.s}" data-ps="${x.id}" aria-label="Начало"><input type="time" value="${x.e}" data-pe="${x.id}" aria-label="Конец"></div></div>`}).join("")}
    <button class="primary block" type="submit">Добавить выбранное</button><button type="button" class="ghost" data-act="close">Не надо</button></form>`);
  layer.querySelector("#apform").addEventListener("submit",ev=>{ev.preventDefault();let n=0;
    for(const x of props){const q=a=>layer.querySelector(`[data-${a}="${x.id}"]`);if(!q("p").checked)continue;const v={t:q("pt").value.trim()||x.t,s:q("ps").value,e:q("pe").value,dir:x.dir};if(toMin(v.e)<=toMin(v.s))continue;d.blocks.push({id:uid(),...v});n++}
    save();layer.innerHTML="";render();toast(n?"Добавлено блоков: "+n:"Ничего не добавлено")})}

/* ---------- CALENDAR EXPORT (.ics → Google / Apple Calendar) ---------- */
function icsFor(days){const z=n=>pad(n),stamp=d=>d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"T"+z(d.getHours())+z(d.getMinutes())+"00";
  const escI=t=>String(t).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Life OS//RU","CALSCALE:GREGORIAN"];let n=0;
  days.forEach(dt=>{const k=dkey(dt),d=S.days[k]||{blocks:[]};const ev=(d.blocks||[]).map(b=>({id:b.id,t:b.t,s:toMin(b.s),e:toMin(b.e),dsc:dirOf(b.dir).name})).concat(classesFor(dt).map(c=>({id:k+c.id,t:c.name,s:c.m,e:c.end,dsc:c.n+" пара"})));
    ev.forEach(x=>{const a=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),0,x.s),b=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),0,x.e);
      L.push("BEGIN:VEVENT","UID:"+x.id+"-"+k+"@lifeos","DTSTAMP:"+stamp(new Date()),"DTSTART:"+stamp(a),"DTEND:"+stamp(b),"SUMMARY:"+escI(x.t),"DESCRIPTION:"+escI(x.dsc+" · Life OS"),"END:VEVENT");n++})});
  L.push("END:VCALENDAR");return {text:L.join("\r\n"),n}}

/* ---------- YEAR IN DOTS ---------- */
function yearDots(){const now=new Date(),y=now.getFullYear(),start=new Date(y,0,1),n=((y%4===0&&y%100!==0)||y%400===0)?366:365,tk=dkey(now);let dots="",done=0,past=0;
  for(let i=0;i<n;i++){const dd=addDays(start,i),k=dkey(dd),fut=dd>now&&k!==tk,p=fut?0:dayProgress(k);if(!fut){past++;if(p>0)done++}
    dots+=`<i class="${p>0?"p":""} ${k===tk?"t":""} ${fut?"f":""}" style="--v:${Math.max(.25,p).toFixed(2)}" title="${dd.getDate()} ${MON[dd.getMonth()]}${fut?"":" · "+Math.round(p*100)+"%"}"></i>`}
  return `<section class="card stack"><div class="spread"><h2>Год точками</h2><span class="small muted">${y} · прошло ${Math.round(past/n*100)}%</span></div><div class="ydots" aria-label="Дни года">${dots}</div><div class="small muted">Одна точка = один день. Чем ярче, тем больше сделано. Активных дней: ${done} из ${past}.</div></section>`}

let OB=null;

      <div class="grid2" style="grid-template-columns:1fr auto"><input id="ob-custom" placeholder="Своё направление" value="${esc(OB.custom)}" data-ob="custom"><button data-act="obcustom">Добавить</button></div>

  if(st===3){next="Начать";const sugg=OB.dirs.map((n,i)=>{const p=PRESETS.find(x=>x[0]===n);return p?{name:p[1],c:i%8}:null}).filter(Boolean);

function finishOB(){
  const dirs=OB.dirs.map((n,i)=>{const old=!S.example&&S.dirs.find(d=>d.name===n);return old?{...old,c:old.c??i%8}:{id:uid(),name:n,c:i%8}});
